ado.","Usá la trazabilidad como hilo conductor. El ejemplo DEMO es ficticio. Cada evento debería registrar fecha, responsable, origen y destino, más los documentos y el identificador de la unidad o pieza. Reclamos y demanda retroalimentan la planificación.","Mostrá qué es evidencia pública, qué proviene del material aportado y qué es diseño académico. Los códigos REVWAL y similares son referencias internas de comprobantes: no deducir plantas, países ni modelos por sus letras. Abrí el PDF y la matriz si necesitás ampliar una fuente."],Z3=[{group:"DIESA",names:["Filadelfia","San Bernardino","Paseo La Galería · City Store","Mcal. López","San Lorenzo","Botánico","Santa Rita","Ciudad del Este","Encarnación"]},{group:"Premium / usados",names:["Porsche Center","Audi Center","España · Usados Premium"]},{group:"Honda",names:["Limpio","San Ignacio","Santaní","Cnel. Oviedo","Curuguaty","Capiatá","Campo 9","Pilar","Katueté","María Auxiliadora","Carapeguá","Lambaré","Acceso Sur","Villarrica","Honda Encarnación","Caaguazú","Ñemby","Itauguá","Luque"]}],Q3={vehicles:[["Volkswagen do Brasil","Vehículos Volkswagen · Brasil"],["Volkswagen Argentina","Volkswagen Amarok · Argentina"],["Volkswagen de México","Vehículos Volkswagen · México"],["Audi México","Audi Q5 · México"]],parts:[["Volkswagen de México","Componentes mecánicos Volkswagen"],["Scania Latin America","Válvulas y componentes Scania"],["Porsche AG","Repuestos y componentes Porsche"],["Honda del Perú","Envíos de repuestos Honda desde Perú"]],logistics:[["Panamericana de Servicios","Flete internacional y aéreo"],["Europartners Paraguay","Flete terrestre internacional"],["AC Group Worldwide Py","Transporte terrestre"],["Southcross Logistics","Flete marítimo internacional"],["DHL Paraguay","Mensajería internacional express"],["Air Systems International","Contacto local de UPS"]]},Nf=[["Pedido","Demanda y proveedor","Pedido de compra, cantidad, proveedor y fecha requerida."],["Embarque","Documentos de transporte","Factura comerci
